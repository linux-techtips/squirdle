# fly.toml app configuration file generated for squirdle on 2026-05-07T12:15:47-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'squirdle'
primary_region = 'dfw'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/api/health"

[[mounts]]
source = "squirdle_data"
destination = "/data"

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024
